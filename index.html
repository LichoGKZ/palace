<title>Contenido Argentina 🔥</title>
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}
(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1383716853246156');
fbq('track', 'PageView');

// ----------- CONFIG -----------
const BACKEND_URL = "https://palace-backend-rsk9.onrender.com"; // <-- reemplazar por la URL real del backend
const DISCORD_INVITE = "https://discord.gg/gn627sW2pc";
// -------------------------------

function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function getQueryParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function buildFbc(){
  // Si Meta ya seteó _fbc, usamos esa
  const existing = getCookie('_fbc');
  if (existing) return existing;
  // Si no, y llegó con fbclid, lo armamos manualmente (formato oficial de Meta)
  const fbclid = getQueryParam('fbclid');
  if (fbclid) {
    return `fb.1.${Date.now()}.${fbclid}`;
  }
  return null;
}

async function generarCodigo(){
  const fbp = getCookie('_fbp');
  const fbc = buildFbc();
  const fbclid = getQueryParam('fbclid');

  try{
    const resp = await fetch(`${BACKEND_URL}/api/session`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ fbp, fbc, fbclid })
    });
    const data = await resp.json();
    mostrarCodigo(data.code);
  }catch(e){
    // Si el backend falla, no bloqueamos al usuario: mostramos igual el botón
    mostrarCodigo(null);
  }
}

function mostrarCodigo(code){
  const codigoEl = document.getElementById("codigo");
  codigoEl.innerText = code || "ERROR";

  // Botón "Entrar" recién aparece a los 1.5s
  setTimeout(()=>{
    document.getElementById("boton").style.display = "inline-block";
  }, 2000);
}

function copiarCodigo(){
  const code = document.getElementById("codigo").innerText;
  navigator.clipboard.writeText(code).then(()=>{
    const aviso = document.getElementById("avisoCopiado");
    aviso.style.opacity = "1";
    setTimeout(()=>{ aviso.style.opacity = "0"; }, 1500);
  });
}

function irDiscord(){
  fbq('track','Lead');
  const boton=document.getElementById("boton");
  boton.disabled = true;
  boton.innerText="Ingresando...";
  setTimeout(function(){
    window.location.href = DISCORD_INVITE;
  }, 400);
}

window.addEventListener('DOMContentLoaded', generarCodigo);
</script>
