<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contenido Argentina 🔥</title>

<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}
(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1383716853246156');
fbq('track', 'PageView');

function irDiscord(){
fbq('track','Lead');

const boton=document.getElementById("boton");
boton.innerText="Ingresando...";

setTimeout(function(){
window.location.href="https://discord.gg/zmep5xzBWN";
},400);
}
</script>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e1f22,#2b2d31);
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
color:white;
}

.contenedor{
text-align:center;
animation:fade 1.2s ease;
}

h1{
font-size:40px;
margin-bottom:40px;
letter-spacing:1px;
text-shadow:0 0 15px rgba(88,101,242,0.6);
}

.boton{
background:#5865F2;
border:none;
color:white;
font-size:24px;
padding:18px 60px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
box-shadow:0 10px 30px rgba(88,101,242,0.5);
transition:all .25s;
}

.boton:hover{
transform:scale(1.07);
background:#4752C4;
box-shadow:0 15px 40px rgba(88,101,242,0.7);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.particulas{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.particulas span{
position:absolute;
display:block;
width:6px;
height:6px;
background:rgba(255,255,255,0.15);
border-radius:50%;
animation:subir 15s linear infinite;
}

@keyframes subir{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-10vh);
}
}

</style>

</head>

<body>

<div class="particulas">
<span style="left:10%;animation-delay:0s"></span>
<span style="left:20%;animation-delay:3s"></span>
<span style="left:35%;animation-delay:5s"></span>
<span style="left:50%;animation-delay:1s"></span>
<span style="left:65%;animation-delay:7s"></span>
<span style="left:80%;animation-delay:2s"></span>
<span style="left:90%;animation-delay:6s"></span>
</div>

<div class="contenedor">

<h1>Todo el contenido de Argentina 🔥</h1>

<button id="boton" class="boton" onclick="irDiscord()">
Entrar al Discord
</button>

</div>

</body>
</html>
