const BACKEND_URL = "https://palace-backend-rsk9.onrender.com"; // <-- reemplazar por la URL real del backend
const DISCORD_INVITE = "https://discord.gg/yGeXXUXu2w";
// -------------------------------

function getCookie(name) {
    const match = document.cookie.match(
        new RegExp('(^| )' + name + '=([^;]+)')
    );

    return match ? decodeURIComponent(match[2]) : null;
}

function getQueryParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function buildFbc() {
    const existing = getCookie('_fbc');

    if (existing) {
        return existing;
    }

    const fbclid = getQueryParam('fbclid');

    if (!fbclid) {
        return null;
    }

    const fbc = `fb.1.${Date.now()}.${fbclid}`;

    // Persistir exactamente el valor generado
    document.cookie = `_fbc=${encodeURIComponent(fbc)}; path=/; max-age=${60 * 60 * 24 * 90}; SameSite=Lax`;

    return fbc;
}

async function generarCodigo() {
    const fbp = getCookie('_fbp');
    const fbc = buildFbc();

    try {
        const resp = await fetch(`${BACKEND_URL}/api/session`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fbp,
                fbc
            })
        });

        const data = await resp.json();
        mostrarCodigo(data.code);

    } catch (e) {
        mostrarCodigo(null);
    }
}

function mostrarCodigo(code){
  const codigoEl = document.getElementById("codigo");
  codigoEl.innerText = code || "ERROR";
}

function copiarCodigo(){
  const code = document.getElementById("codigo").innerText;
  navigator.clipboard.writeText(code).then(()=>{
    const aviso = document.getElementById("avisoCopiado");
    aviso.style.opacity = "1";
    setTimeout(()=>{ aviso.style.opacity = "0"; }, 1500);
  });
}

function irDiscord(){
  fbq('track','Lead');
  const boton=document.getElementById("boton");
  boton.disabled = true;
  boton.innerText="Ingresando...";
  setTimeout(function(){
    window.location.href = DISCORD_INVITE;
  }, 400);
}

window.addEventListener('DOMContentLoaded', () => {
  generarCodigo(); // arranca a pedir el código ya mismo, en segundo plano

  setTimeout(() => {
    document.getElementById('contenedor').classList.add('visible');
  }, 2000);

  setTimeout(() => {
    document.getElementById('boton').style.display = 'inline-block';
  }, 4000);
});
