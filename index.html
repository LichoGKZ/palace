<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contenido Argentina 🔥</title>
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}
(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1383716853246156');
fbq('track', 'PageView');

// ----------- CONFIG -----------
const BACKEND_URL = "https://palace-backend-rsk9.onrender.com"; // <-- reemplazar por la URL real del backend
const DISCORD_INVITE = "https://discord.gg/gn627sW2pc";
// -------------------------------

function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function getQueryParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function buildFbc(){
  // Si Meta ya seteó _fbc, usamos esa
  const existing = getCookie('_fbc');
  if (existing) return existing;
  // Si no, y llegó con fbclid, lo armamos manualmente (formato oficial de Meta)
  const fbclid = getQueryParam('fbclid');
  if (fbclid) {
    return `fb.1.${Date.now()}.${fbclid}`;
  }
  return null;
}

async function generarCodigo(){
  const fbp = getCookie('_fbp');
  const fbc = buildFbc();
  const fbclid = getQueryParam('fbclid');

  try{
    const resp = await fetch(`${BACKEND_URL}/api/session`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ fbp, fbc, fbclid })
    });
    const data = await resp.json();
    mostrarCodigo(data.code);
  }catch(e){
    // Si el backend falla, no bloqueamos al usuario: mostramos igual el botón
    mostrarCodigo(null);
  }
}

function mostrarCodigo(code){
  const codigoEl = document.getElementById("codigo");
  codigoEl.innerText = code || "ERROR";

  // Botón "Entrar" recién aparece a los 1.5s
  setTimeout(()=>{
    document.getElementById("boton").style.display = "inline-block";
  }, 2000);
}

function copiarCodigo(){
  const code = document.getElementById("codigo").innerText;
  navigator.clipboard.writeText(code).then(()=>{
    const aviso = document.getElementById("avisoCopiado");
    aviso.style.opacity = "1";
    setTimeout(()=>{ aviso.style.opacity = "0"; }, 1500);
  });
}

function irDiscord(){
  fbq('track','Lead');
  const boton=document.getElementById("boton");
  boton.disabled = true;
  boton.innerText="Ingresando...";
  setTimeout(function(){
    window.location.href = DISCORD_INVITE;
  }, 400);
}

window.addEventListener('DOMContentLoaded', generarCodigo);
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1383716853246156&ev=PageView&noscript=1"
/></noscript>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e1f22,#2b2d31);
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
color:white;
}
.contenedor{
text-align:center;
animation:fade 1.2s ease;
max-width:520px;
padding:0 20px;
}
h1{
font-size:40px;
margin-bottom:40px;
letter-spacing:1px;
text-shadow:0 0 15px rgba(88,101,242,0.6);
}
p.instrucciones{
font-size:16px;
line-height:1.5;
color:#dcdde3;
margin-bottom:30px;
}
.codigo-box{
font-size:42px;
font-weight:bold;
letter-spacing:8px;
background:#111214;
border:2px solid #5865F2;
border-radius:10px;
padding:18px 30px;
margin-bottom:8px;
display:inline-block;
box-shadow:0 0 20px rgba(88,101,242,0.4);
cursor:pointer;
user-select:all;
transition:all .2s;
}
.codigo-box:hover{
transform:scale(1.04);
background:#17181b;
}
.aviso-copiado{
height:20px;
font-size:14px;
color:#57F287;
opacity:0;
transition:opacity .3s;
margin-bottom:22px;
}
.boton{
background:#5865F2;
border:none;
color:white;
font-size:24px;
padding:18px 60px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
box-shadow:0 10px 30px rgba(88,101,242,0.5);
transition:all .25s;
}
.boton:hover{
transform:scale(1.07);
background:#4752C4;
box-shadow:0 15px 40px rgba(88,101,242,0.7);
}
.boton:disabled{
opacity:0.7;
cursor:default;
transform:none;
}
@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
.particulas{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}
.particulas span{
position:absolute;
display:block;
width:6px;
height:6px;
background:rgba(255,255,255,0.15);
border-radius:50%;
animation:subir 15s linear infinite;
}
@keyframes subir{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-10vh);
}
}
</style>
</head>
<body>
<div class="particulas">
<span style="left:10%;animation-delay:0s"></span>
<span style="left:20%;animation-delay:3s"></span>
<span style="left:35%;animation-delay:5s"></span>
<span style="left:50%;animation-delay:1s"></span>
<span style="left:65%;animation-delay:7s"></span>
<span style="left:80%;animation-delay:2s"></span>
<span style="left:90%;animation-delay:6s"></span>
</div>

<div class="contenedor">
<h1>Todo el contenido de Argentina 🔥</h1>

<p class="instrucciones">Guardá este código para entrar al Discord</p>
<div class="codigo-box" id="codigo" onclick="copiarCodigo()">----</div>
<div id="avisoCopiado" class="aviso-copiado">¡Copiado!</div>


<button id="boton" class="boton" onclick="irDiscord()" style="display:none;">
Entrar al Discord
</button>
</div>

</body>
</html>
